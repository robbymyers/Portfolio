<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Quote · Freelance</title>
  <link rel="icon" type="image/svg+xml" href="../img/favicon.svg" />
  <link rel="stylesheet" href="../css/styles.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app"></div>
  <script type="module">
    import { mountApp, table, toast, esc, qs, money, fmtDate, todayISO, quoteBadge, confirmAction } from './app.js';
    import { nextNumber } from './db.js';

    mountApp({ active: 'clients', render: async (main) => {
      const qid = qs('id');
      const presetClient = qs('client');

      const [{ data: settings }, { data: clients }] = await Promise.all([
        table('settings').select('*').eq('id', 1).maybeSingle(),
        table('clients').select('id,name,business_name').order('name'),
      ]);

      let quote, items = [];
      if (qid) {
        quote = (await table('quotes').select('*').eq('id', qid).maybeSingle()).data;
        items = (await table('quote_items').select('*').eq('quote_id', qid).order('sort_order')).data || [];
      } else {
        const validity = (settings && settings.default_quote_validity) || 30;
        const vu = new Date(); vu.setDate(vu.getDate() + validity);
        quote = { client_id: presetClient || (clients[0] && clients[0].id), issue_date: todayISO(),
          valid_until: `${vu.getFullYear()}-${String(vu.getMonth() + 1).padStart(2, '0')}-${String(vu.getDate()).padStart(2, '0')}`,
          status: 'draft', terms: '', notes: '' };
      }
      if (!items.length) items = [{ description: '', quantity: 1, unit_price: 0 }];

      let engagements = [];
      async function loadEngagements(cid) {
        engagements = (await table('engagements').select('id,title').eq('client_id', cid).order('created_at', { ascending: false })).data || [];
      }
      await loadEngagements(quote.client_id);

      const total = () => items.reduce((s, it) => s + (Number(it.quantity) || 0) * (Number(it.unit_price) || 0), 0);
      const clientName = (cid) => { const c = clients.find((x) => x.id === cid); return c ? (c.business_name || c.name) : ''; };

      function render() {
        main.innerHTML = `
        <div class="fc-screen">
          <div class="fc-page-head fc-no-print">
            <a class="fc-crumb" href="${quote.client_id ? `client.html?id=${quote.client_id}` : 'clients.html'}">&larr; Back</a>
            <div class="fc-spacer"></div>
            ${qid ? quoteBadge(quote) : ''}
            <button class="fc-btn" id="print-btn">Print / Save PDF</button>
            <button class="fc-btn fc-btn--primary" id="save-btn">Save</button>
          </div>
          <h1 style="font-family:var(--fc-head);text-transform:uppercase;font-size:30px;margin:0 0 16px">
            Quote ${esc(quote.number) || '<span class="fc-muted">(draft)</span>'}
          </h1>

          <div class="fc-card">
            <div class="fc-row">
              <label class="fc-field"><span>Client</span><select id="f-client">${clients.map((c) => `<option value="${c.id}" ${c.id === quote.client_id ? 'selected' : ''}>${esc(c.business_name || c.name)}</option>`).join('')}</select></label>
              <label class="fc-field"><span>Engagement (optional)</span><select id="f-eng"></select></label>
            </div>
            <div class="fc-row">
              <label class="fc-field"><span>Issue date</span><input type="date" id="f-issue" value="${esc(quote.issue_date)}" /></label>
              <label class="fc-field"><span>Valid until</span><input type="date" id="f-valid" value="${esc(quote.valid_until)}" /></label>
            </div>
          </div>

          <div class="fc-card" style="margin-top:16px">
            <h2>Line items</h2>
            <table class="fc-table fc-items"><thead><tr><th>Description</th><th style="width:90px">Qty</th><th style="width:130px">Unit price</th><th style="width:120px" class="num">Amount</th><th style="width:40px"></th></tr></thead>
            <tbody id="items"></tbody></table>
            <button class="fc-btn fc-btn--sm" id="add-item" style="margin-top:10px">+ Add line</button>
            <div class="fc-total-line">Total <span id="total">${money(total())}</span></div>
          </div>

          <div class="fc-card" style="margin-top:16px">
            <label class="fc-field"><span>Terms</span><textarea id="f-terms">${esc(quote.terms)}</textarea></label>
            <label class="fc-field"><span>Notes</span><textarea id="f-notes">${esc(quote.notes)}</textarea></label>
          </div>

          ${qid ? `<div class="fc-card fc-no-print" style="margin-top:16px">
            <h2>Status & actions</h2>
            <div class="fc-row" style="align-items:center">
              ${['draft', 'sent', 'accepted', 'declined', 'expired'].map((s) => `<button class="fc-btn fc-btn--sm ${s === quote.status ? 'fc-btn--dark' : 'fc-btn--ghost'}" data-status="${s}">${s}</button>`).join('')}
              <div class="fc-spacer" style="margin-left:auto"></div>
              <button class="fc-btn fc-btn--primary" id="convert">Convert to invoice &rarr;</button>
            </div>
          </div>` : ''}
        </div>

        ${printDoc()}`;

        renderEngOptions();
        renderItems();
        wire();
      }

      function renderEngOptions() {
        const sel = main.querySelector('#f-eng');
        sel.innerHTML = `<option value="">—</option>` + engagements.map((e) => `<option value="${e.id}" ${e.id === quote.engagement_id ? 'selected' : ''}>${esc(e.title || 'Engagement')}</option>`).join('');
      }

      function renderItems() {
        const tb = main.querySelector('#items');
        tb.innerHTML = items.map((it, i) => `
          <tr>
            <td><input data-i="${i}" data-k="description" value="${esc(it.description)}" /></td>
            <td><input data-i="${i}" data-k="quantity" type="number" step="0.01" value="${esc(it.quantity)}" /></td>
            <td><input data-i="${i}" data-k="unit_price" type="number" step="0.01" value="${esc(it.unit_price)}" /></td>
            <td class="num">${money((Number(it.quantity) || 0) * (Number(it.unit_price) || 0))}</td>
            <td><button class="fc-btn fc-btn--sm fc-btn--ghost" data-del="${i}">✕</button></td>
          </tr>`).join('');
        tb.querySelectorAll('input').forEach((inp) => inp.addEventListener('input', () => {
          items[inp.dataset.i][inp.dataset.k] = inp.value;
          main.querySelector('#total').textContent = money(total());
          const amtCell = inp.closest('tr').querySelector('.num');
          const it = items[inp.dataset.i];
          amtCell.textContent = money((Number(it.quantity) || 0) * (Number(it.unit_price) || 0));
        }));
        tb.querySelectorAll('[data-del]').forEach((b) => b.addEventListener('click', () => {
          items.splice(Number(b.dataset.del), 1); if (!items.length) items.push({ description: '', quantity: 1, unit_price: 0 }); renderItems();
          main.querySelector('#total').textContent = money(total());
        }));
      }

      function printDoc() {
        const s = settings || {};
        return `<div class="fc-print"><div class="doc">
          <div class="doc-head">
            <div class="doc-biz"><h1>${esc(s.business_name) || 'Robby Myers'}</h1>
              ${s.address ? `<p>${esc(s.address)}</p>` : ''}${s.email ? `<p>${esc(s.email)}</p>` : ''}${s.phone ? `<p>${esc(s.phone)}</p>` : ''}</div>
            <div class="doc-meta"><div class="doc-number">QUOTE ${esc(quote.number) || ''}</div>
              <p>Issued ${fmtDate(quote.issue_date)}</p><p>Valid until ${fmtDate(quote.valid_until)}</p></div>
          </div>
          <div class="doc-two"><div><h3>Prepared for</h3><p>${esc(clientName(quote.client_id))}</p></div></div>
          <table><thead><tr><th>Description</th><th class="num">Qty</th><th class="num">Unit</th><th class="num">Amount</th></tr></thead>
          <tbody>${items.map((it) => `<tr><td>${esc(it.description)}</td><td class="num">${esc(it.quantity)}</td><td class="num">${money(it.unit_price)}</td><td class="num">${money((Number(it.quantity) || 0) * (Number(it.unit_price) || 0))}</td></tr>`).join('')}</tbody></table>
          <div class="doc-total">Total <span>${money(total())}</span></div>
          <div class="doc-foot">
            ${s.payment_instructions ? `<h3>Payment</h3><p>${esc(s.payment_instructions)}</p>` : ''}
            ${quote.terms ? `<h3>Terms</h3><p>${esc(quote.terms)}</p>` : ''}
            ${quote.notes ? `<p>${esc(quote.notes)}</p>` : ''}
            ${s.footer_text ? `<p style="margin-top:14px">${esc(s.footer_text)}</p>` : ''}
          </div>
        </div></div>`;
      }

      function collect() {
        quote.client_id = main.querySelector('#f-client').value;
        quote.engagement_id = main.querySelector('#f-eng').value || null;
        quote.issue_date = main.querySelector('#f-issue').value || null;
        quote.valid_until = main.querySelector('#f-valid').value || null;
        quote.terms = main.querySelector('#f-terms').value || null;
        quote.notes = main.querySelector('#f-notes').value || null;
      }

      async function save() {
        collect();
        if (!quote.client_id) { toast('Pick a client', 'err'); return; }
        if (!qid && !quote.number) quote.number = await nextNumber('quote');
        const payload = { number: quote.number, client_id: quote.client_id, engagement_id: quote.engagement_id,
          issue_date: quote.issue_date, valid_until: quote.valid_until, status: quote.status,
          terms: quote.terms, notes: quote.notes };
        let savedId = qid;
        if (qid) { const { error } = await table('quotes').update(payload).eq('id', qid); if (error) { toast(error.message, 'err'); return; } }
        else { const { data, error } = await table('quotes').insert(payload).select('id').single(); if (error) { toast(error.message, 'err'); return; } savedId = data.id; }
        await table('quote_items').delete().eq('quote_id', savedId);
        const clean = items.filter((it) => (it.description || '').trim() || Number(it.unit_price));
        if (clean.length) await table('quote_items').insert(clean.map((it, i) => ({ quote_id: savedId, description: it.description || null, quantity: Number(it.quantity) || 0, unit_price: Number(it.unit_price) || 0, sort_order: i })));
        if (!qid) { location.href = `quote.html?id=${savedId}`; return; }
        toast('Quote saved');
      }

      function wire() {
        main.querySelector('#f-client').addEventListener('change', async (e) => { quote.client_id = e.target.value; await loadEngagements(quote.client_id); quote.engagement_id = null; renderEngOptions(); });
        main.querySelector('#add-item').addEventListener('click', () => { items.push({ description: '', quantity: 1, unit_price: 0 }); renderItems(); });
        main.querySelector('#save-btn').addEventListener('click', save);
        main.querySelector('#print-btn').addEventListener('click', () => window.print());
        main.querySelectorAll('[data-status]').forEach((b) => b.addEventListener('click', async () => {
          collect(); quote.status = b.dataset.status;
          await table('quotes').update({ status: quote.status }).eq('id', qid);
          toast(`Marked ${quote.status}`); render();
        }));
        const conv = main.querySelector('#convert');
        if (conv) conv.addEventListener('click', convertToInvoice);
      }

      async function convertToInvoice() {
        await save();
        const number = await nextNumber('invoice');
        const net = (settings && settings.default_net_days) || 30;
        const due = new Date(); due.setDate(due.getDate() + net);
        const dueISO = `${due.getFullYear()}-${String(due.getMonth() + 1).padStart(2, '0')}-${String(due.getDate()).padStart(2, '0')}`;
        const { data: inv, error } = await table('invoices').insert({ number, client_id: quote.client_id, engagement_id: quote.engagement_id, quote_id: qid, issue_date: todayISO(), due_date: dueISO, status: 'draft', terms: quote.terms, notes: quote.notes }).select('id').single();
        if (error) { toast(error.message, 'err'); return; }
        const clean = items.filter((it) => (it.description || '').trim() || Number(it.unit_price));
        if (clean.length) await table('invoice_items').insert(clean.map((it, i) => ({ invoice_id: inv.id, description: it.description || null, quantity: Number(it.quantity) || 0, unit_price: Number(it.unit_price) || 0, sort_order: i })));
        location.href = `invoice.html?id=${inv.id}`;
      }

      render();
    }});
  </script>
</body>
</html>
